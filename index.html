<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park Shopper Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Park Shopper Calculator</h1>
      <p class="subtitle">Tax (6.5%) + shopper fee, calculated automatically</p>
    </header>

    <form id="item-form" class="item-form">
      <div class="field">
        <label for="item-name">Item</label>
        <input type="text" id="item-name" placeholder="e.g. tshirt" required>
      </div>
      <div class="field">
        <label for="item-price">Retail price ($)</label>
        <input type="number" id="item-price" placeholder="0.00" step="0.01" min="0" required>
      </div>
      <button type="submit" class="btn-add">Add item</button>
    </form>

    <section class="items-section">
      <div class="items-header">
        <h2>Items</h2>
        <button id="clear-all" class="btn-text" type="button">Clear all</button>
      </div>
      <ul id="items-list" class="items-list"></ul>
      <p id="empty-state" class="empty-state">No items yet — add one above.</p>
    </section>

    <section class="shipping-section">
      <h2>Package weight</h2>
      <div class="weight-options">
        <label class="weight-option">
          <input type="radio" name="package-weight" value="light">
          <span>Light <em>$7.75</em></span>
        </label>
        <label class="weight-option">
          <input type="radio" name="package-weight" value="normal" checked>
          <span>Normal <em>$8.35</em></span>
        </label>
        <label class="weight-option">
          <input type="radio" name="package-weight" value="heavy">
          <span>Heavy <em>$9.86</em></span>
        </label>
      </div>
    </section>

    <section class="summary-section">
      <div class="summary-header">
        <h2>Summary</h2>
        <button id="copy-btn" class="btn-copy" type="button">Copy to clipboard</button>
      </div>
      <pre id="summary-output" class="summary-output"></pre>
    </section>

    <section class="payment-link-section">
      <button id="create-link-btn" class="btn-add btn-full" type="button">Create Square payment link</button>
      <div id="payment-link-result" class="payment-link-result" style="display:none;">
        <input id="payment-link-url" type="text" readonly>
        <button id="copy-link-btn" class="btn-copy" type="button">Copy link</button>
      </div>
      <p id="payment-link-error" class="payment-link-error" style="display:none;"></p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
